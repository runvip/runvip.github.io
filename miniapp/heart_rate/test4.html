<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>rPPG Пульсометр (Mobile)</title>
  
  <!-- MediaPipe CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; touch-action: manipulation; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    h1 {
      font-size: 20px;
      margin: 0 0 15px 0;
      text-align: center;
    }

    .container {
      position: relative;
      width: 100%;
      max-width: 400px;
      aspect-ratio: 3 / 4;
      border-radius: 16px;
      overflow: hidden;
      background-color: #000;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }

    video { display: none; }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Зеркальное отображение фронтальной камеры */
    }

    .dashboard {
      width: 100%;
      max-width: 400px;
      margin-top: 15px;
      background: #1e1e1e;
      padding: 15px 20px;
      border-radius: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .bpm-box {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .bpm-value {
      font-size: 42px;
      font-weight: 800;
      color: #ff4757;
      font-family: monospace;
    }

    .bpm-unit {
      font-size: 16px;
      color: #888;
      font-weight: bold;
    }

    .status-box {
      text-align: right;
    }

    .status-text {
      font-size: 13px;
      color: #2ed573;
      font-weight: 600;
    }

    .progress-bar-container {
      width: 120px;
      height: 6px;
      background-color: #333;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 6px;
      margin-left: auto;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background-color: #2ed573;
      transition: width 0.2s linear;
    }
  </style>
</head>
<body>

  <h1>rPPG Измеритель Пульса</h1>

  <div class="container">
    <video id="video" playsinline></video>
    <canvas id="canvas"></canvas>
  </div>

  <div class="dashboard">
    <div class="bpm-box">
      <span class="bpm-value" id="bpmDisplay">--</span>
      <span class="bpm-unit">BPM</span>
    </div>
    <div class="status-box">
      <div class="status-text" id="statusText">Запуск камеры...</div>
      <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('video');
    const canvasElement = document.getElementById('canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const bpmDisplay = document.getElementById('bpmDisplay');
    const statusText = document.getElementById('statusText');
    const progressBar = document.getElementById('progressBar');

    // Точки лба для MediaPipe
    const FOREHEAD_INDEXES = [10, 67, 109, 338, 297];

    const BUFFER_SECONDS = 7;
    const timeBuffer = [];
    const rgbBuffer = [];

    // Инициализация FaceMesh с оптимизацией под мобильные
    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });

    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: false,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    faceMesh.onResults(onResults);

    // Запуск фронтальной камеры смартфона
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await faceMesh.send({ image: videoElement });
      },
      width: 480,
      height: 640,
      facingMode: 'user' // Выбор фронтальной камеры
    });

    camera.start().then(() => {
      statusText.innerText = "Поместите лицо в кадр";
    }).catch(err => {
      statusText.innerText = "Ошибка доступа к камере";
      console.error(err);
    });

    function onResults(results) {
      // Адаптируем размер Canvas под реальный видеопоток
      if (canvasElement.width !== videoElement.videoWidth) {
        canvasElement.width = videoElement.videoWidth || 480;
        canvasElement.height = videoElement.videoHeight || 640;
      }

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const landmarks = results.multiFaceLandmarks[0];

        // Получение прямоугольной области (Bounding Box) лба
        const roi = getForeheadBoundingBox(landmarks, canvasElement.width, canvasElement.height);

        // Отрисовка рамки ROI
        canvasCtx.strokeStyle = '#2ed573';
        canvasCtx.lineWidth = 2;
        canvasCtx.strokeRect(roi.x, roi.y, roi.width, roi.height);

        // Быстрое считывание RGB из Bounding Box
        const rgb = getFastAverageRGB(roi);

        if (rgb.count > 0) {
          const now = performance.now() / 1000; // Время в секундах
          rgbBuffer.push(rgb);
          timeBuffer.push(now);

          // Удаляем устаревшие данные (старше BUFFER_SECONDS)
          while (timeBuffer.length > 0 && (now - timeBuffer[0]) > BUFFER_SECONDS) {
            timeBuffer.shift();
            rgbBuffer.shift();
          }

          const fillRatio = Math.min(1, (now - timeBuffer[0]) / BUFFER_SECONDS);
          progressBar.style.width = `${fillRatio * 100}%`;

          if (fillRatio < 1) {
            statusText.innerText = "Замрите... Идет сбор данных";
          } else {
            statusText.innerText = "Измерение...";

            // 1. Применяем POS алгоритм
            const posSignal = processPOS(rgbBuffer);

            // 2. Считаем фактический FPS смартфона
            const actualFps = timeBuffer.length / (now - timeBuffer[0]);

            // 3. Вычисляем BPM через спектральный анализ
            const bpm = calculateBPM(posSignal, actualFps);

            if (bpm) {
              bpmDisplay.innerText = bpm;
            }
          }
        }
      } else {
        statusText.innerText = "Лицо не найдено";
        progressBar.style.width = '0%';
        rgbBuffer.length = 0;
        timeBuffer.length = 0;
      }

      canvasCtx.restore();
    }

    // Быстрый поиск прямоугольника лба (оптимизация вместо полигона)
    function getForeheadBoundingBox(landmarks, width, height) {
      let minX = width, maxX = 0, minY = height, maxY = 0;

      FOREHEAD_INDEXES.forEach(idx => {
        const x = landmarks[idx].x * width;
        const y = landmarks[idx].y * height;
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      });

      return {
        x: Math.floor(minX),
        y: Math.floor(minY),
        width: Math.max(1, Math.floor(maxX - minX)),
        height: Math.max(1, Math.floor(maxY - minY))
      };
    }

    // Оптимизированное извлечение RGB
    function getFastAverageRGB(roi) {
      const imageData = canvasCtx.getImageData(roi.x, roi.y, roi.width, roi.height);
      const data = imageData.data;
      let sumR = 0, sumG = 0, sumB = 0;
      const totalPixels = data.length / 4;

      for (let i = 0; i < data.length; i += 4) {
        sumR += data[i];
        sumG += data[i + 1];
        sumB += data[i + 2];
      }

      return {
        r: sumR / totalPixels,
        g: sumG / totalPixels,
        b: sumB / totalPixels,
        count: totalPixels
      };
    }

    // Алгоритм POS (Plane-Orthogonal-to-Skin)
    function processPOS(buffer) {
      const N = buffer.length;
      let meanR = 0, meanG = 0, meanB = 0;

      for (let i = 0; i < N; i++) {
        meanR += buffer[i].r;
        meanG += buffer[i].g;
        meanB += buffer[i].b;
      }
      meanR /= N; meanG /= N; meanB /= N;

      const S1 = [], S2 = [];
      for (let i = 0; i < N; i++) {
        const rNorm = buffer[i].r / (meanR || 1);
        const gNorm = buffer[i].g / (meanG || 1);
        const bNorm = buffer[i].b / (meanB || 1);

        S1.push(gNorm - bNorm);
        S2.push(gNorm + bNorm - 2 * rNorm);
      }

      const std1 = getStdDev(S1);
      const std2 = getStdDev(S2);
      const alpha = std2 === 0 ? 0 : std1 / std2;

      const S = [];
      for (let i = 0; i < N; i++) {
        S.push(S1[i] + alpha * S2[i]);
      }
      return S;
    }

    // Вычисление BPM по динамическому FPS
    function calculateBPM(signal, fps) {
      const N = signal.length;
      const mean = signal.reduce((a, b) => a + b, 0) / N;
      const centered = signal.map(v => v - mean);

      // Окно Ханна
      const windowed = centered.map((v, i) => v * (0.5 * (1 - Math.cos((2 * Math.PI * i) / (N - 1)))));

      let maxPower = 0;
      let peakFreq = 0;

      // Дипозон пульса: 48–180 BPM (0.8–3.0 Гц)
      for (let freq = 0.8; freq <= 3.0; freq += 0.02) {
        let real = 0, imag = 0;
        for (let t = 0; t < N; t++) {
          const angle = (2 * Math.PI * freq * t) / fps;
          real += windowed[t] * Math.cos(angle);
          imag -= windowed[t] * Math.sin(angle);
        }
        const power = real * real + imag * imag;
        if (power > maxPower) {
          maxPower = power;
          peakFreq = freq;
        }
      }

      return Math.round(peakFreq * 60);
    }

    function getStdDev(arr) {
      const mean = arr.reduce((a, b) => a + b, 0) / arr.length;
      return Math.sqrt(arr.reduce((sq, n) => sq + Math.pow(n - mean, 2), 0) / arr.length);
    }
  </script>
</body>
</html>
